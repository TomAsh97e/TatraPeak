name: C++ build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 -DTATRA_BUILD_DESKTOP_IO=OFF
      - name: Build
        run: cmake --build build/windows --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build/windows -C Debug --output-on-failure --no-tests=error
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure host mobile-core
        run: cmake --preset mobile-core
      - name: Build host mobile-core
        run: cmake --build --preset mobile-core --parallel 2
      - name: Test C and C++ APIs
        run: ctest --preset mobile-core
      - name: Configure iOS arm64 static libraries
        run: >-
          cmake -S . -B build/ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DTATRA_BUILD_TESTS=OFF
          -DTATRA_BUILD_CLI=OFF
          -DTATRA_BUILD_DESKTOP_IO=OFF
          -DTATRA_BUILD_MOBILE_BRIDGE=ON
      - name: Build iOS mobile bridge
        run: cmake --build build/ios --config Release --target tatra_mobile --parallel 2
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android arm64 static libraries
        run: >-
          cmake -S . -B build/android-arm64 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
          -DTATRA_BUILD_TESTS=OFF
          -DTATRA_BUILD_CLI=OFF
          -DTATRA_BUILD_DESKTOP_IO=OFF
          -DTATRA_BUILD_MOBILE_BRIDGE=ON
      - name: Build Android mobile bridge
        run: cmake --build build/android-arm64 --target tatra_mobile --parallel 2
      - name: Install pinned application toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6'
      - name: JVM JNI tests, lint and arm64 APKs (no device acceptance)
        working-directory: android
        run: ./gradlew test lintDebug assembleDebug assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-arm64
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/tests/
